<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css</title>
    <style>
        .info{
            border:5px;
            width:200px;
            height:120px;
            margin: 15px;
            background-color:rgba(225, 220, 180,0.8);
            border-style:solid solid solid solid;
            border-color: rgba(26, 131, 229,0.7);
            background-image: linear-gradient(to right,rgb(157, 160, 235),rgb(173, 213, 173));
            padding:80px 20px;
            border-radius: 14px;
        }
         button{
             margin-top:25px;
             border:none;
             border-radius:20px;
             padding:7px 20px;
             background-color:#3898ec;
             color:#fff;
         }
    
         .info:hover{
           
            box-shadow: 0 0 10px blue ;
        }
        .info:hover button{ 
             background-color:#d51c8e;
            box-shadow: 0 0 10px rgb(213, 213, 31) ;
        }
    </style>
</head>
<body>
    <div class="info">
         <h3>🌿 自然之美</h3>
         <p>感受大自然的宁静与和谐，<br>让心灵在绿色中得到洗礼。</p >
         <button>探索更多</button>
    </body>
</html>
